name: Checks
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]'
      - run: pytest -q
      - run: python scripts/verify.py
      - run: node --check src/spendscope/web/app.js
  real-data:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: r-lib/actions/setup-r@v2
      - run: pip install -e '.[dev]'
      - run: Rscript -e 'install.packages(c("ggplot2","jsonlite","svglite"), repos="https://cloud.r-project.org")'
      - run: Rscript R/test_concentration.R
      - run: python -m spendscope.pipeline --root .
      - run: python scripts/verify.py
