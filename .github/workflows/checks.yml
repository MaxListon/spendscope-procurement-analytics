name: Checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements-lock.txt
      - run: pip install -e '.[dev]'
      - name: Prepare dashboard report assets
        run: mkdir -p docs/reports && cp reports/* docs/reports/
      - run: pytest -q
      - run: python scripts/verify.py
      - run: node --check src/spendscope/web/app.js
      - run: node --check src/spendscope/web/workspace.js
      - run: node --test scripts/test_review_model.cjs
  real-data:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.3'
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::ggplot2
            any::jsonlite
            any::svglite
          install-quarto: false
      - run: pip install -r requirements-lock.txt
      - name: Install built Python distribution
        run: |
          pip wheel --no-deps . --wheel-dir dist
          pip install dist/spendscope-*.whl
      - run: Rscript R/test_concentration.R
      - name: Preserve expected analysis
        run: |
          cp reports/analysis.json "$RUNNER_TEMP/expected-analysis.json"
          cp docs/workspace/index.json "$RUNNER_TEMP/expected-workspace.json"
      - run: python -m spendscope.pipeline --root .
      - run: python scripts/compare_results.py "$RUNNER_TEMP/expected-analysis.json" reports/analysis.json
      - run: python scripts/compare_results.py "$RUNNER_TEMP/expected-workspace.json" docs/workspace/index.json
      - name: Record source-refresh review
        run: python scripts/review_refresh.py "$RUNNER_TEMP/expected-analysis.json" reports/analysis.json --output "$RUNNER_TEMP/refresh-review.json"
      - uses: actions/upload-artifact@v4
        with:
          name: source-refresh-review
          path: ${{ runner.temp }}/refresh-review.json
      - run: python scripts/verify.py
      - run: pytest -q
