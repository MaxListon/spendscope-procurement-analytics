[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "spendscope"
version = "0.1.0"
description = "Reproducible public procurement and supplier concentration analytics"
requires-python = ">=3.12"
dependencies = ["duckdb>=1.2,<3", "pandas>=2.2,<4", "certifi>=2024.2"]
[project.optional-dependencies]
dev = ["pytest>=8,<10"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
